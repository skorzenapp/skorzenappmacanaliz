    <script>
      (function () {
        function showError(kind, message, source, line, column) {
          var panel = document.getElementById('skz-diagnostic');
          if (!panel) {
            panel = document.createElement('pre');
            panel.id = 'skz-diagnostic';
            panel.style.cssText = 'position:fixed;inset:12px;z-index:2147483647;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#210d12;color:#fff;border:2px solid #ff6b6b;border-radius:12px;padding:16px;font:13px/1.5 monospace;box-shadow:0 8px 40px #000';
            document.addEventListener('DOMContentLoaded', function(){ if (!panel.isConnected) document.body.appendChild(panel); });
            (document.body || document.documentElement).appendChild(panel);
          }
          panel.textContent = 'SKORZEN AÇILIŞ HATASI\n\nTür: ' + kind + '\nHata: ' + (message || 'Bilinmeyen hata') + '\nDosya: ' + (source || '-') + '\nSatır: ' + (line || '-') + ' Sütun: ' + (column || '-') + '\n\nBu ekran görüntüsünü destek ekibine gönder.';
        }
        window.addEventListener('error', function (e) {
          showError('JavaScript', e.message, e.filename, e.lineno, e.colno);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          showError('Promise', reason && (reason.stack || reason.message) || String(reason));
        });
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && !root.children.length && !document.getElementById('skz-diagnostic')) {
              showError('Render', 'Uygulama 8 saniye içinde root alanına içerik çizmedi.', location.href);
            }
          }, 8000);
        });
      })();
